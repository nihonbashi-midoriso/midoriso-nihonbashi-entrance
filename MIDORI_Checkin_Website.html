<!DOCTYPE html>
<html>

<head>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;

      background: #f5f5f5;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #222;
    }


    .container {
      width: 100%;
      max-width: 420px;

      margin: 40px auto;

      padding: 28px 24px;

      background: white;

      border-radius: 16px;

      box-shadow:
        0 4px 20px
        rgba(0, 0, 0, 0.08);
    }


    /* =========================
       Language
       ========================= */

    .languages {
      display: flex;
      justify-content: center;

      gap: 6px;

      margin-bottom: 25px;
    }


    .languageButton {
      width: auto;

      padding: 7px 10px;

      border:
        1px solid #ddd;

      border-radius: 8px;

      background: white;

      color: #555;

      font-size: 12px;

      cursor: pointer;
    }


    .languageButton.active {
      background: #222;

      color: white;

      border-color: #222;
    }


    /* =========================
       Heading
       ========================= */

    h1 {
      margin: 0 0 10px;

      text-align: center;

      font-size: 28px;

      line-height: 1.3;
    }


    .subtitle {
      margin-bottom: 30px;

      text-align: center;

      color: #666;

      font-size: 16px;

      line-height: 1.8;
    }


    label {
      display: block;

      margin-bottom: 8px;

      font-size: 17px;

      font-weight: 600;
    }


    .hint {
      margin-top: -3px;

      margin-bottom: 10px;

      color: #777;

      font-size: 14px;

      line-height: 1.7;
    }


    input {
      width: 100%;

      padding: 14px 15px;

      margin-bottom: 18px;

      border:
        1px solid #ccc;

      border-radius: 9px;

      font-size: 17px;

      background: white;

      outline: none;
    }


    input:focus {
      border-color: #555;
    }


    /* =========================
       Buttons
       ========================= */

    button {
      width: 100%;

      padding: 12px 15px;

      border: none;

      border-radius: 9px;

      background: #222;

      color: white;

      font-size: 16px;

      line-height: 1.4;

      cursor: pointer;
    }


    button:disabled {
      background: #999;

      cursor: default;
    }


    #message {
      margin-top: 18px;

      text-align: center;

      color: #d00;

      font-size: 15px;

      line-height: 1.7;
    }


    /* =========================
       Result
       ========================= */

    #result {
      display: none;

      margin-top: 10px;

      padding-top: 10px;

      text-align: center;
    }


    .confirmed {
      margin-bottom: 24px;

      font-size: 19px;

      line-height: 1.8;
    }


    .question {
      margin-bottom: 18px;

      font-size: 19px;

      font-weight: 600;

      line-height: 1.8;
    }


    .instruction {
      margin-bottom: 18px;

      padding: 18px;

      border-radius: 10px;

      background: #f5f5f5;

      text-align: left;

      font-size: 17px;

      line-height: 1.9;
    }


    .linkButton {
      display: block;

      width: 100%;

      padding: 13px 15px;

      margin-bottom: 10px;

      border-radius: 9px;

      color: white;

      text-decoration: none;

      text-align: center;

      font-size: 16px;

      line-height: 1.5;

      background: #222;
    }


    .choiceButton {
      margin-bottom: 10px;
    }


    .secondaryButton {
      background: white;

      color: #222;

      border:
        1px solid #ccc;
    }


    .helpTitle {
      margin-top: 28px;

      margin-bottom: 12px;

      font-size: 16px;

      font-weight: 600;

      text-align: center;
    }



    .initialHelpSection {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #eee;
      text-align: center;
    }

    .initialHelpButton {
      width: 100%;
      margin-top: 10px;
      background: white;
      color: #222;
      border: 1px solid #ccc;
    }

    .initialHelpMessage {
      display: none;
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .compactHelpTitle {
      margin-top: 16px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #666;
    }

    .compactHelpLinks {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .compactHelpLink {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 7px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #222;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }

    .arrivalSection {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .arrivalMessage {
      display: none;
      margin-top: 12px;
      text-align: center;
      font-size: 16px;
      line-height: 1.8;
    }

    /* =========================
       Mobile
       ========================= */

    @media (max-width: 600px) {

      body {
        padding: 0;

        background: white;
      }


      .container {
        width: 100%;

        max-width: none;

        min-height: 100vh;

        margin: 0;

        padding:
          28px
          22px
          40px;

        border-radius: 0;

        box-shadow: none;
      }


      .languages {
        gap: 7px;

        margin-bottom: 32px;
      }


      .languageButton {
        padding: 8px 12px;

        border-radius: 8px;

        font-size: 13px;
      }


      h1 {
        font-size: 30px;

        margin-bottom: 13px;
      }


      .subtitle {
        margin-bottom: 34px;

        font-size: 17px;

        line-height: 1.8;
      }


      label {
        margin-bottom: 9px;

        font-size: 18px;
      }


      .hint {
        margin-bottom: 12px;

        font-size: 15px;

        line-height: 1.7;
      }


      input {
        padding: 15px 14px;

        margin-bottom: 18px;

        border-radius: 9px;

        font-size: 18px;

        -webkit-appearance: none;
      }


      #checkButton {
        padding: 14px;

        border-radius: 9px;

        font-size: 17px;

        min-height: 50px;
      }


      #message {
        margin-top: 20px;

        font-size: 15px;

        line-height: 1.7;
      }


      .confirmed {
        font-size: 19px;

        line-height: 1.8;

        margin-bottom: 26px;
      }


      .question {
        font-size: 19px;

        line-height: 1.8;

        margin-bottom: 20px;
      }


      .instruction {
        padding: 18px;

        font-size: 17px;

        line-height: 1.9;
      }


      .linkButton,
      .choiceButton {
        padding: 14px;

        min-height: 50px;

        font-size: 17px;

        line-height: 1.5;
      }

    }


    @media (max-width: 380px) {

      .container {
        padding-left: 18px;

        padding-right: 18px;
      }


      h1 {
        font-size: 28px;
      }


      .subtitle {
        font-size: 16px;
      }


      input {
        font-size: 18px;
      }


      #checkButton {
        font-size: 17px;
      }


      .question {
        font-size: 18px;
      }


      .instruction {
        font-size: 16px;
      }

    }

  </style>

</head>

<div class="container">


  <!-- =========================
       Language
       ========================= -->

  <div class="languages">

    <button
      class="languageButton active"
      id="lang-en"
      onclick="setLanguage('en')"
    >
      EN
    </button>

    <button
      class="languageButton"
      id="lang-ja"
      onclick="setLanguage('ja')"
    >
      日本語
    </button>

    <button
      class="languageButton"
      id="lang-ko"
      onclick="setLanguage('ko')"
    >
      한국어
    </button>

    <button
      class="languageButton"
      id="lang-zh"
      onclick="setLanguage('zh')"
    >
      中文
    </button>

  </div>


  <!-- =========================
       Check-in form
       ========================= -->

  <div id="checkinForm">

    <h1 id="title">
      Check-in
    </h1>


    <div
      class="subtitle"
      id="subtitle"
    >
      Please enter the full name<br>
      used for your reservation.
    </div>


    <label id="nameLabel">
      Full Name
    </label>


    <div
      class="hint"
      id="nameHint"
    >
      Enter your name as it appears on your reservation.<br>
      Example: <strong>John Smith</strong>
    </div>


    <input
      type="text"
      id="fullName"
      placeholder="Your full name"
      autocomplete="name"
      autocapitalize="words"
    >


    <button
      id="checkButton"
      onclick="checkReservation()"
    >
      Continue
    </button>


    <div id="message"></div>


    <!-- =========================
         Initial help
         ========================= -->

    <div class="initialHelpSection" id="initialHelpSection">
      <button
        class="initialHelpButton"
        id="doorIssueButton"
        type="button"
        onclick="notifyDoorIssue()"
      >
        Door won't open
      </button>

      <div class="compactHelpTitle" id="initialHelpTitle">Need Help?</div>

      <div class="compactHelpLinks">
        <a
          class="compactHelpLink"
          id="phoneHelpButton"
          href="tel:07093818951"
        >
          Call Staff
        </a>

        <a
          class="compactHelpLink"
          id="whatsappHelpButton"
          href="https://wa.me/817093818951"
          target="_blank"
          rel="noopener noreferrer"
        >
          WhatsApp
        </a>
      </div>

      <div class="initialHelpMessage" id="doorIssueMessage"></div>
    </div>

  </div>


  <!-- =========================
       Result
       ========================= -->

  <div id="result">


    <div
      class="confirmed"
      id="confirmedText"
    ></div>


    <!-- =========================
         Form question
         ========================= -->

    <div
      class="question"
      id="formQuestion"
    ></div>


    <button
      class="choiceButton"
      id="yesButton"
      onclick="showCompleted()"
    ></button>


    <button
      class="choiceButton secondaryButton"
      id="noButton"
      onclick="showNotCompleted()"
    ></button>


    <!-- =========================
         Final instruction
         ========================= -->

    <div
      class="instruction"
      id="instructionText"
      style="display:none"
    ></div>


    <!-- =========================
         Entrance key
         ========================= -->

    <a
      id="openKey"
      class="linkButton"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      style="display:none"
    >
    </a>


    <!-- =========================
         Google Form
         ========================= -->

    <a
      id="formButton"
      class="linkButton"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
      style="display:none"
    >
    </a>


    <!-- =========================
         Staff arrival notification
         ========================= -->

    <div class="arrivalSection" id="arrivalSection" style="display:none">
      <div class="instruction" id="arrivalInstruction">
        If there is no staff at the lounge, please press the button below and wait.
      </div>
      <button id="arrivalButton" type="button" onclick="notifyStaffArrival()">
        Notify Staff of My Arrival
      </button>
      <div class="arrivalMessage" id="arrivalMessage"></div>
    </div>


  </div>

</div>

/* ==================================================
   State
   ================================================== */

let currentLanguage =
  "en";

let reservationData =
  null;

let arrivalNotificationSent =
  false;

let doorIssueNotificationSent =
  false;

let doorIssueMessageType =
  "";


/* ==================================================
   Language
   ================================================== */

function setLanguage(language) {

  currentLanguage =
    language;

  const t =
    texts[language];


  document
    .getElementById("title")
    .innerHTML =
    t.title;


  document
    .getElementById("subtitle")
    .innerHTML =
    t.subtitle;


  document
    .getElementById("nameLabel")
    .textContent =
    t.nameLabel;


  document
    .getElementById("nameHint")
    .innerHTML =
    t.nameHint;


  document
    .getElementById("fullName")
    .placeholder =
    t.placeholder;


  document
    .getElementById("checkButton")
    .textContent =
    t.continue;

  document
    .getElementById("initialHelpTitle")
    .textContent =
    t.helpTitle;

  document
    .getElementById("phoneHelpButton")
    .textContent =
    t.phoneHelp;

  document
    .getElementById("whatsappHelpButton")
    .textContent =
    t.whatsappHelp;

  document
    .getElementById("doorIssueButton")
    .textContent =
    t.doorIssueButton;

  if (doorIssueMessageType === "success") {
    document.getElementById("doorIssueMessage").textContent =
      t.doorIssueSuccess;
  } else if (doorIssueMessageType === "error") {
    document.getElementById("doorIssueMessage").textContent =
      t.doorIssueError;
  }


  document
    .getElementById("formQuestion")
    .textContent =
    t.question;


  document
    .getElementById("yesButton")
    .textContent =
    t.yes;


  document
    .getElementById("noButton")
    .textContent =
    t.no;


  document
    .getElementById("arrivalInstruction")
    .textContent =
    t.arrivalInstruction;

  document
    .getElementById("arrivalButton")
    .textContent =
    t.arrivalButton;


  document
    .getElementById("openKey")
    .textContent =
    t.key;


  document
    .getElementById("formButton")
    .textContent =
    t.form;


  document
    .querySelectorAll(".languageButton")
    .forEach(
      function(button) {

        button.classList.remove(
          "active"
        );

      }
    );


  document
    .getElementById(
      "lang-" + language
    )
    .classList.add(
      "active"
    );


  if (
    document
      .getElementById("result")
      .style
      .display === "block"
  ) {

    if (
      document
        .getElementById("instructionText")
        .style
        .display !== "none"
    ) {

      if (
        document
          .getElementById("formButton")
          .style
          .display !== "none"
      ) {

        document
          .getElementById("instructionText")
          .textContent =
          t.notDoneInstruction;

      } else {

        document
          .getElementById("instructionText")
          .textContent =
          t.doneInstruction;

      }

    }

  }

}


/* ==================================================
   Standalone website API bridge
   ================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyI5iKz4sG6-9hYIaU7mLedvb1a99XEqpbrgQczjKijkNJP5u_P7xkXffrqtIbG8RKO/exec";

let apiRequestCounter = 0;

function apiCall(action, params, successHandler, failureHandler) {
  const callbackName =
    "midoriApiCallback_" + (++apiRequestCounter) + "_" + Date.now();
  const script = document.createElement("script");
  const query = new URLSearchParams();

  query.set("api", "1");
  query.set("action", action);
  query.set("callback", callbackName);
  Object.keys(params || {}).forEach(function(key) {
    query.set(key, params[key] == null ? "" : String(params[key]));
  });

  let finished = false;
  const timeoutId = setTimeout(function() {
    if (finished) return;
    finished = true;
    cleanup();
    if (failureHandler) failureHandler(new Error("API request timed out."));
  }, 15000);

  function cleanup() {
    clearTimeout(timeoutId);
    try { delete window[callbackName]; } catch (e) {}
    if (script.parentNode) script.parentNode.removeChild(script);
  }

  window[callbackName] = function(data) {
    if (finished) return;
    finished = true;
    cleanup();
    if (successHandler) successHandler(data);
  };

  script.onerror = function(error) {
    if (finished) return;
    finished = true;
    cleanup();
    if (failureHandler) failureHandler(error);
  };

  script.src = API_URL + "?" + query.toString();
  document.head.appendChild(script);
}


/* ==================================================
   Reservation check
   ================================================== */

function checkReservation() {

  const fullName =
    document
      .getElementById("fullName")
      .value
      .trim();


  const button =
    document
      .getElementById("checkButton");


  const message =
    document
      .getElementById("message");


  const t =
    texts[currentLanguage];


  message.textContent =
    "";


  if (!fullName) {

    message.textContent =
      t.empty;

    return;

  }


  button.disabled =
    true;

  button.textContent =
    t.checking;


  apiCall(
    "checkGuest",
    { fullName: fullName },
    function(data) {

        button.disabled =
          false;

        button.textContent =
          t.continue;


        if (!data || !data.success) {

          message.style.color =
            "#d00";

          message.textContent =
            data && data.message
              ? data.message
              : t.error;

          return;

        }


        reservationData =
          data;


        document
          .getElementById("checkinForm")
          .style
          .display =
          "none";


        document
          .getElementById("result")
          .style
          .display =
          "block";


        document
          .getElementById("confirmedText")
          .textContent =
          t.confirmed;


        document
          .getElementById("formQuestion")
          .textContent =
          t.question;


        document
          .getElementById("yesButton")
          .textContent =
          t.yes;


        document
          .getElementById("noButton")
          .textContent =
          t.no;


        document
          .getElementById("instructionText")
          .style
          .display =
          "none";


        document
          .getElementById("openKey")
          .style
          .display =
          "none";


        document
          .getElementById("formButton")
          .style
          .display =
          "none";


        document
          .getElementById("openKey")
          .href =
          data.keyUrl;


        document
          .getElementById("formButton")
          .href =
          data.formUrl;


        message.textContent =
          "";

      },
    function(error) {

        button.disabled =
          false;

        button.textContent =
          t.continue;

        message.style.color =
          "#d00";

        message.textContent =
          t.error;

        console.error(error);

      }
  );

}

/* ==================================================
   Staff arrival notification
   ================================================== */

function notifyDoorIssue() {
  const fullName = document.getElementById("fullName").value.trim();
  const button = document.getElementById("doorIssueButton");
  const message = document.getElementById("doorIssueMessage");
  const t = texts[currentLanguage];

  if (doorIssueNotificationSent) return;

  doorIssueNotificationSent = true;
  button.disabled = true;
  button.textContent = t.doorIssueSending;
  message.style.display = "none";

  apiCall(
    "notifyDoorIssue",
    { fullName: fullName },
    function(data) {
      if (data && data.success) {
        doorIssueMessageType = "success";
        message.style.display = "block";
        message.style.color = "#222";
        message.textContent = t.doorIssueSuccess;
        button.style.display = "none";
      } else {
        doorIssueNotificationSent = false;
        doorIssueMessageType = "error";
        button.disabled = false;
        button.textContent = t.doorIssueButton;
        message.style.display = "block";
        message.style.color = "#d00";
        message.textContent = t.doorIssueError;
      }
    },
    function(error) {
      console.error(error);
      doorIssueNotificationSent = false;
      doorIssueMessageType = "error";
      button.disabled = false;
      button.textContent = t.doorIssueButton;
      message.style.display = "block";
      message.style.color = "#d00";
      message.textContent = t.doorIssueError;
    }
  );
}


function notifyStaffArrival() {
  const fullName = document.getElementById("fullName").value.trim();
  const button = document.getElementById("arrivalButton");
  const message = document.getElementById("arrivalMessage");
  const t = texts[currentLanguage];

  if (!fullName) {
    message.style.display = "block";
    message.style.color = "#d00";
    message.textContent = t.empty;
    return;
  }

  if (arrivalNotificationSent) return;

  button.disabled = true;
  button.textContent = t.arrivalSending;
  message.style.display = "none";

  apiCall(
    "notifyStaffArrival",
    { fullName: fullName },
    function(data) {
      if (data && data.success) {
        arrivalNotificationSent = true;
        message.style.display = "block";
        message.style.color = "#222";
        message.textContent = t.arrivalSuccess;
        button.style.display = "none";
      } else {
        button.disabled = false;
        button.textContent = t.arrivalButton;
        message.style.display = "block";
        message.style.color = "#d00";
        message.textContent = t.arrivalError;
      }
    },
    function(error) {
      console.error(error);
      button.disabled = false;
      button.textContent = t.arrivalButton;
      message.style.display = "block";
      message.style.color = "#d00";
      message.textContent = t.arrivalError;
    }
  );
}
