<!DOCTYPE html>
<html>

<head>

    name="viewport"
    content="width=device-width, initial-scale=1"

  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;

      background: #f5f5f5;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #222;
    }


    .container {
      width: 100%;
      max-width: 420px;

      margin: 40px auto;

      padding: 28px 24px;

      background: white;

      border-radius: 16px;

      box-shadow:
        0 4px 20px
        rgba(0, 0, 0, 0.08);
    }


    /* =========================
       Language
       ========================= */

    .languages {
      display: flex;
      justify-content: center;

      gap: 6px;

      margin-bottom: 25px;
    }


    .languageButton {
      width: auto;

      padding: 7px 10px;

      border:
        1px solid #ddd;

      border-radius: 8px;

      background: white;

      color: #555;

      font-size: 12px;

      cursor: pointer;
    }


    .languageButton.active {
      background: #222;

      color: white;

      border-color: #222;
    }


    /* =========================
       Heading
       ========================= */

    h1 {
      margin: 0 0 10px;

      text-align: center;

      font-size: 28px;

      line-height: 1.3;
    }


    .subtitle {
      margin-bottom: 30px;

      text-align: center;

      color: #666;

      font-size: 16px;

      line-height: 1.8;
    }


    label {
      display: block;

      margin-bottom: 8px;

      font-size: 17px;

      font-weight: 600;
    }


    .hint {
      margin-top: -3px;

      margin-bottom: 10px;

      color: #777;

      font-size: 14px;

      line-height: 1.7;
    }


    input {
      width: 100%;

      padding: 14px 15px;

      margin-bottom: 18px;

      border:
        1px solid #ccc;

      border-radius: 9px;

      font-size: 17px;

      background: white;

      outline: none;
    }


    input:focus {
      border-color: #555;
    }


    /* =========================
       Buttons
       ========================= */

    button {
      width: 100%;

      padding: 12px 15px;

      border: none;

      border-radius: 9px;

      background: #222;

      color: white;

      font-size: 16px;

      line-height: 1.4;

      cursor: pointer;
    }


    button:disabled {
      background: #999;

      cursor: default;
    }


    #message {
      margin-top: 18px;

      text-align: center;

      color: #d00;

      font-size: 15px;

      line-height: 1.7;
    }


    /* =========================
       Result
       ========================= */

    #result {
      display: none;

      margin-top: 10px;

      padding-top: 10px;

      text-align: center;
    }


    .confirmed {
      margin-bottom: 24px;

      font-size: 19px;

      line-height: 1.8;
    }


    .instruction {
      margin-bottom: 18px;

      padding: 18px;

      border-radius: 10px;

      background: #f5f5f5;

      text-align: left;

      font-size: 17px;

      line-height: 1.9;
    }


    .linkButton {
      display: block;

      width: 100%;

      padding: 13px 15px;

      margin-bottom: 10px;

      border-radius: 9px;

      color: white;

      text-decoration: none;

      text-align: center;

      font-size: 16px;

      line-height: 1.5;

      background: #222;
    }


    .helpTitle {
      margin-top: 28px;

      margin-bottom: 12px;

      font-size: 16px;

      font-weight: 600;

      text-align: center;
    }



    .initialHelpSection {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #eee;
      text-align: center;
    }

    .initialHelpButton {
      width: 100%;
      margin-top: 10px;
      background: white;
      color: #222;
      border: 1px solid #ccc;
    }

    .initialHelpMessage {
      display: none;
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .compactHelpTitle {
      margin-top: 16px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #666;
    }

    .compactHelpLinks {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .compactHelpLink {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 7px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #222;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }

    .arrivalSection {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .arrivalMessage {
      display: none;
      margin-top: 12px;
      text-align: center;
      font-size: 16px;
      line-height: 1.8;

function setLanguage(language) {

  currentLanguage = language;
  const t = texts[language];

  document.getElementById("title").textContent = t.title;
  document.getElementById("subtitle").innerHTML = t.subtitle;
  document.getElementById("nameLabel").textContent = t.nameLabel;
  document.getElementById("nameHint").innerHTML = t.nameHint;
  document.getElementById("fullName").placeholder = t.placeholder;
  document.getElementById("checkButton").textContent = t.continue;

  document.getElementById("initialHelpTitle").textContent = t.helpTitle;
  document.getElementById("phoneHelpButton").textContent = t.phoneHelp;
  document.getElementById("whatsappHelpButton").textContent = t.whatsappHelp;
  document.getElementById("doorIssueButton").textContent = t.doorIssueButton;

  if (doorIssueMessageType === "success") {
    document.getElementById("doorIssueMessage").textContent = t.doorIssueSuccess;
  } else if (doorIssueMessageType === "error") {
    document.getElementById("doorIssueMessage").textContent = t.doorIssueError;
  }

  document.getElementById("arrivalInstruction").textContent = t.arrivalInstruction;
  document.getElementById("arrivalButton").textContent = t.arrivalButton;
  document.getElementById("openKey").textContent = t.key;
  document.getElementById("formButton").textContent = t.form;

  document.getElementById("resultHelpTitle").textContent = t.helpTitle;
  document.getElementById("resultPhoneHelpButton").textContent = t.phoneHelpShort;
  document.getElementById("resultWhatsappHelpButton").textContent = t.whatsappHelp;

  document.querySelectorAll(".languageButton").forEach(function(button) {
    button.classList.remove("active");
  });

  document.getElementById("lang-" + language).classList.add("active");

  if (document.getElementById("result").style.display === "block") {
    document.getElementById("instructionText").textContent = t.doneInstruction;
  }
}


/* ==================================================
   Standalone website API bridge
   ================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyI5iKz4sG6-9hYIaU7mLedvb1a99XEqpbrgQczjKijkNJP5u_P7xkXffrqtIbG8RKO/exec";

let apiRequestCounter = 0;

function apiCall(action, params, successHandler, failureHandler) {
  const callbackName =
    "midoriApiCallback_" + (++apiRequestCounter) + "_" + Date.now();
  const script = document.createElement("script");
  const query = new URLSearchParams();

  query.set("api", "1");
  query.set("action", action);
  query.set("callback", callbackName);
  Object.keys(params || {}).forEach(function(key) {
    query.set(key, params[key] == null ? "" : String(params[key]));
  });

  let finished = false;
  const timeoutId = setTimeout(function() {
    if (finished) return;
    finished = true;
    cleanup();
    if (failureHandler) failureHandler(new Error("API request timed out."));
  }, 15000);

  function cleanup() {
    clearTimeout(timeoutId);
    try { delete window[callbackName]; } catch (e) {}
    if (script.parentNode) script.parentNode.removeChild(script);
  }

  window[callbackName] = function(data) {
    if (finished) return;
    finished = true;
    cleanup();
    if (successHandler) successHandler(data);
  };

  script.onerror = function(error) {
    if (finished) return;
    finished = true;
    cleanup();
    if (failureHandler) failureHandler(error);
  };

  script.src = API_URL + "?" + query.toString();
  document.head.appendChild(script);
}


/* ==================================================
   Reservation check
   ================================================== */

function checkReservation() {

  const fullName =
    document.getElementById("fullName").value.trim();

  const button =
    document.getElementById("checkButton");

  const message =
    document.getElementById("message");

  const t =
    texts[currentLanguage];

  message.textContent = "";

  if (!fullName) {
    message.textContent = t.empty;
    return;
  }

  button.disabled = true;
  button.textContent = t.checking;

  apiCall(
    "checkGuest",
    { fullName: fullName },
    function(data) {

      button.disabled = false;
      button.textContent = t.continue;

      if (!data || !data.success) {
        message.style.color = "#d00";
        message.textContent =
          data && data.message
            ? data.message
            : t.error;
        return;
      }

      reservationData = data;

      document.getElementById("checkinForm").style.display = "none";
      document.getElementById("result").style.display = "block";

      document.getElementById("confirmedText").textContent = t.confirmed;
      document.getElementById("instructionText").textContent = t.doneInstruction;
      document.getElementById("instructionText").style.display = "block";

      document.getElementById("formButton").href = data.formUrl;
      document.getElementById("formButton").style.display = "flex";

      document.getElementById("openKey").href = data.keyUrl;
      document.getElementById("openKey").style.display = "flex";

      document.getElementById("arrivalSection").style.display = "block";

      message.textContent = "";
    },
    function(error) {

      button.disabled = false;
      button.textContent = t.continue;

      message.style.color = "#d00";
      message.textContent = t.error;

      console.error(error);
    }
  );
}


/* ==================================================
   Staff arrival notification
   ================================================== */

function notifyDoorIssue() {
  const fullName = document.getElementById("fullName").value.trim();
  const button = document.getElementById("doorIssueButton");
  const message = document.getElementById("doorIssueMessage");
  const t = texts[currentLanguage];

  if (doorIssueNotificationSent) return;

  doorIssueNotificationSent = true;
  button.disabled = true;
  button.textContent = t.doorIssueSending;
  message.style.display = "none";

  apiCall(
    "notifyDoorIssue",
    { fullName: fullName },
    function(data) {
      if (data && data.success) {
        doorIssueMessageType = "success";
        message.style.display = "block";
        message.style.color = "#222";
        message.textContent = t.doorIssueSuccess;
        button.style.display = "none";
      } else {
        doorIssueNotificationSent = false;
        doorIssueMessageType = "error";
        button.disabled = false;
        button.textContent = t.doorIssueButton;
        message.style.display = "block";
        message.style.color = "#d00";
        message.textContent = t.doorIssueError;
      }
    },
    function(error) {
      console.error(error);
      doorIssueNotificationSent = false;
      doorIssueMessageType = "error";
      button.disabled = false;
      button.textContent = t.doorIssueButton;
      message.style.display = "block";
      message.style.color = "#d00";
      message.textContent = t.doorIssueError;
    }
  );
}


function notifyStaffArrival() {
  const fullName = document.getElementById("fullName").value.trim();
  const button = document.getElementById("arrivalButton");
  const message = document.getElementById("arrivalMessage");
  const t = texts[currentLanguage];

  if (!fullName) {
    message.style.display = "block";
    message.style.color = "#d00";
    message.textContent = t.empty;
    return;
  }

  if (arrivalNotificationSent) return;

  button.disabled = true;
  button.textContent = t.arrivalSending;
  message.style.display = "none";

  apiCall(
    "notifyStaffArrival",
    { fullName: fullName },
    function(data) {
      if (data && data.success) {
        arrivalNotificationSent = true;
        message.style.display = "block";
        message.style.color = "#222";
        message.textContent = t.arrivalSuccess;
        button.style.display = "none";
      } else {
        button.disabled = false;
        button.textContent = t.arrivalButton;
        message.style.display = "block";
        message.style.color = "#d00";
        message.textContent = t.arrivalError;
      }
    },
    function(error) {
      console.error(error);
      button.disabled = false;
      button.textContent = t.arrivalButton;
      message.style.display = "block";
      message.style.color = "#d00";
      message.textContent = t.arrivalError;
    }
  );
}


/* ==================================================
   Reset
   ================================================== */

function resetPage() {

  reservationData = null;
  arrivalNotificationSent = false;
  doorIssueNotificationSent = false;
  doorIssueMessageType = "";

  document.getElementById("result").style.display = "none";
  document.getElementById("checkinForm").style.display = "block";
  document.getElementById("fullName").value = "";
  document.getElementById("message").textContent = "";

  document.getElementById("instructionText").style.display = "none";
  document.getElementById("openKey").style.display = "none";
  document.getElementById("formButton").style.display = "none";
  document.getElementById("arrivalSection").style.display = "none";

  document.getElementById("arrivalButton").style.display = "block";
  document.getElementById("arrivalButton").disabled = false;
  document.getElementById("arrivalButton").textContent =
    texts[currentLanguage].arrivalButton;
  document.getElementById("arrivalMessage").style.display = "none";
  document.getElementById("arrivalMessage").textContent = "";

  document.getElementById("doorIssueButton").style.display = "block";
  document.getElementById("doorIssueButton").disabled = false;
  document.getElementById("doorIssueButton").textContent =
    texts[currentLanguage].doorIssueButton;
  document.getElementById("doorIssueMessage").style.display = "none";
  document.getElementById("doorIssueMessage").textContent = "";
}


/* ==================================================
   Enter key
   ================================================== */

document
  .getElementById("fullName")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        checkReservation();

      }

    }
  );


/* ==================================================
   Initial language
   ================================================== */

setLanguage(
  currentLanguage
);

</script>
